<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- PWA Meta -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Super App" />
  
  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <title>Super App</title>

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .app-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    .app-area iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-muted);
      background: var(--bg);
      z-index: 10;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .bottom-nav {
      display: flex;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 4px calc(8px + env(safe-area-inset-bottom));
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      z-index: 20;
    }

    .bottom-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-item {
      flex: 1;
      min-width: 70px;
      max-width: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px 4px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 500;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .nav-item .icon {
      font-size: 1.4rem;
      line-height: 1;
    }

    .nav-item.active {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .nav-item.active .icon {
      transform: scale(1.08);
    }
  </style>
</head>
<body>

  <div class="app-area" id="appArea">
    <div class="placeholder" id="placeholder">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker registered'))
          .catch(err => console.error('Service Worker failed', err));
      });
    }

    (function () {
      const appArea = document.getElementById('appArea');
      const placeholder = document.getElementById('placeholder');
      const bottomNav = document.getElementById('bottomNav');

      let currentIframe = null;
      let activeAppId = null;
      let apps = [];

      async function init() {
        try {
          const res = await fetch('./apps.json');
          apps = await res.json();

          if (!apps.length) {
            placeholder.innerHTML = `<span style="font-size:2rem">📭</span><span>No apps found</span>`;
            return;
          }

          renderNav();
          switchApp(apps[0].id);
        } catch (err) {
          placeholder.innerHTML = `<span style="font-size:2rem">⚠️</span><span>Failed to load apps</span>`;
          console.error(err);
        }
      }

      function renderNav() {
        bottomNav.innerHTML = '';
        apps.forEach(app => {
          const btn = document.createElement('button');
          btn.className = 'nav-item';
          btn.dataset.id = app.id;
          btn.innerHTML = `
            <span class="icon">${app.icon || '📱'}</span>
            <span>${app.name}</span>
          `;
          btn.addEventListener('click', () => switchApp(app.id));
          bottomNav.appendChild(btn);
        });
      }

      function switchApp(id) {
        if (activeAppId === id) return;

        const app = apps.find(a => a.id === id);
        if (!app) return;

        if (currentIframe) {
          currentIframe.remove();
          currentIframe = null;
        }

        placeholder.style.display = 'flex';

        const iframe = document.createElement('iframe');
        iframe.src = app.path;
        iframe.setAttribute('allow', 'microphone; camera; geolocation');
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads allow-top-navigation-by-user-activation');

        iframe.onload = () => {
          placeholder.style.display = 'none';
        };

        setTimeout(() => {
          if (placeholder.style.display !== 'none') {
            placeholder.style.display = 'none';
          }
        }, 3000);

        appArea.appendChild(iframe);
        currentIframe = iframe;
        activeAppId = id;

        document.querySelectorAll('.nav-item').forEach(item => {
          item.classList.toggle('active', item.dataset.id === id);
        });
      }

      init();
    })();
  </script>
</body>
</html>
