<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Super App" />
  
  <link rel="apple-touch-icon" href="icons/icon-152.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <title>Super App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      position: relative;
    }

    .app-area {
      position: absolute;
      inset: 0;
      background: #fff;
    }

    .app-area iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #94a3b8;
      background: #0f172a;
      z-index: 5;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Floating Hamburger Button - Fixed for iOS */
    .menu-btn {
      position: fixed;
      top: calc(18px + env(safe-area-inset-top));
      left: 18px;
      width: 46px;
      height: 46px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      z-index: 100;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
      transition: 0.25s;
    }

    .menu-btn:active {
      transform: scale(0.94);
    }

    .menu-btn span {
      display: block;
      width: 18px;
      height: 2px;
      background: #f1f5f9;
      border-radius: 2px;
    }

    /* Side Menu */
    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100%;
      background: #0f172a;
      z-index: 200;
      transform: translateX(-100%);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 8px 0 30px rgba(0,0,0,0.4);
    }

    .side-menu.open {
      transform: translateX(0);
    }

    .side-header {
      padding: 28px 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .side-header h2 {
      color: #f1f5f9;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .side-header p {
      color: #64748b;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .side-menu-items {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 24px;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 2px 10px;
      border-radius: 12px;
    }

    .menu-item .icon {
      font-size: 1.25rem;
      width: 28px;
      text-align: center;
    }

    .menu-item:hover {
      background: rgba(255,255,255,0.05);
      color: #e2e8f0;
    }

    .menu-item.active {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }

    /* Install Button */
    .install-section {
      padding: 16px 20px 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .install-btn {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }

    .install-btn:active {
      transform: scale(0.97);
      background: #2563eb;
    }

    .install-btn.hidden {
      display: none;
    }

    /* iOS Install Modal */
    .ios-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .ios-modal.show {
      display: flex;
    }

    .ios-content {
      background: #1e293b;
      width: 100%;
      max-width: 400px;
      border-radius: 20px 20px 0 0;
      padding: 24px;
      color: #f1f5f9;
    }

    .ios-content h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
    }

    .ios-content ol {
      padding-left: 20px;
      line-height: 1.7;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .ios-content button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      transition: 0.3s;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>

  <!-- Floating Menu Button -->
  <div class="menu-btn" id="menuBtn">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Side Menu -->
  <div class="side-menu" id="sideMenu">
    <div class="side-header">
      <h2>Super App</h2>
      <p>Select an application</p>
    </div>
    <div class="side-menu-items" id="menuItems"></div>

    <div class="install-section">
      <button class="install-btn" id="installBtn">
        <span>⬇️</span>
        <span>Install App</span>
      </button>
    </div>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- iOS Install Instructions -->
  <div class="ios-modal" id="iosModal">
    <div class="ios-content">
      <h3>Install Super App on iPhone</h3>
      <ol>
        <li>Tap the <strong>Share</strong> button at the bottom of Safari</li>
        <li>Scroll down and tap <strong>Add to Home Screen</strong></li>
        <li>Tap <strong>Add</strong> in the top right</li>
      </ol>
      <button id="closeIosModal">Got it</button>
    </div>
  </div>

  <!-- App Area -->
  <div class="app-area" id="appArea">
    <div class="placeholder" id="placeholder">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
  </div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker registered'))
          .catch(err => console.error('Service Worker failed', err));
      });
    }

    const menuBtn = document.getElementById('menuBtn');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuItems = document.getElementById('menuItems');
    const appArea = document.getElementById('appArea');
    const placeholder = document.getElementById('placeholder');
    const installBtn = document.getElementById('installBtn');
    const iosModal = document.getElementById('iosModal');
    const closeIosModal = document.getElementById('closeIosModal');

    let currentIframe = null;
    let activeAppId = null;
    let apps = [];
    let deferredPrompt = null;

    // Detect iOS
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isInStandalone = window.navigator.standalone === true;

    // ===== Install Logic =====
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
    });

    window.addEventListener('appinstalled', () => {
      installBtn.classList.add('hidden');
      deferredPrompt = null;
    });

    if (isInStandalone || window.matchMedia('(display-mode: standalone)').matches) {
      installBtn.classList.add('hidden');
    }

    installBtn.addEventListener('click', async () => {
      if (isIOS) {
        iosModal.classList.add('show');
        closeMenu();
        return;
      }

      if (!deferredPrompt) {
        alert('Install is not available right now. Please try using Chrome or Edge.');
        return;
      }

      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.classList.add('hidden');
      }
      deferredPrompt = null;
    });

    closeIosModal.addEventListener('click', () => {
      iosModal.classList.remove('show');
    });

    // ===== App Logic =====
    async function init() {
      try {
        const res = await fetch('./apps.json');
        apps = await res.json();

        if (!apps.length) {
          placeholder.innerHTML = `<span style="font-size:2rem">📭</span><span>No apps found</span>`;
          return;
        }

        renderMenu();

        const lastAppId = localStorage.getItem('superapp-last-app');
        const appToLoad = apps.find(a => a.id === lastAppId) || apps[0];
        switchApp(appToLoad.id);

      } catch (err) {
        placeholder.innerHTML = `<span style="font-size:2rem">⚠️</span><span>Failed to load apps</span>`;
        console.error(err);
      }
    }

    function renderMenu() {
      menuItems.innerHTML = '';
      apps.forEach(app => {
        const item = document.createElement('div');
        item.className = 'menu-item';
        item.dataset.id = app.id;
        item.innerHTML = `
          <span class="icon">${app.icon || '📱'}</span>
          <span>${app.name}</span>
        `;
        item.addEventListener('click', () => {
          switchApp(app.id);
          closeMenu();
        });
        menuItems.appendChild(item);
      });
    }

    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('show');
    }

    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('show');
    }

    menuBtn.addEventListener('click', openMenu);
    overlay.addEventListener('click', closeMenu);

    function switchApp(id) {
      if (activeAppId === id) return;

      const app = apps.find(a => a.id === id);
      if (!app) return;

      if (currentIframe) {
        currentIframe.remove();
        currentIframe = null;
      }

      placeholder.style.display = 'flex';

      const iframe = document.createElement('iframe');
      iframe.src = app.path;

      // Allow WhatsApp and other external links
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads allow-top-navigation allow-top-navigation-by-user-activation');
      iframe.setAttribute('allow', 'microphone; camera; geolocation');

      iframe.onload = () => {
        placeholder.style.display = 'none';
      };

      setTimeout(() => {
        if (placeholder.style.display !== 'none') {
          placeholder.style.display = 'none';
        }
      }, 3000);

      appArea.appendChild(iframe);
      currentIframe = iframe;
      activeAppId = id;

      localStorage.setItem('superapp-last-app', id);

      document.querySelectorAll('.menu-item').forEach(item => {
        item.classList.toggle('active', item.dataset.id === id);
      });
    }

    init();
  </script>
</body>
</html>
