<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Housekeeping Service Translator</title>

    <!-- PWA meta tags (kept as required) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ===== FULL HEIGHT IFRAME FILL - ADDED ===== */
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: auto;
            overscroll-behavior: none;
        }

        /* ===== CSS Variables ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root[data-theme="dark"] {
            --bg-body: #0b1120;
            --bg-card: #1a2332cc;
            --bg-card-solid: #1a2332;
            --bg-input: #0f172a;
            --bg-chip: #2a3a52;
            --bg-chip-hover: #3a4e6b;
            --bg-surface: #1e293b;
            --border: #2a3a52;
            --border-light: #334155;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --primary: #4f8cff;
            --primary-hover: #3b7beb;
            --primary-glow: rgba(79, 140, 255, 0.25);
            --accent: #34d399;
            --accent-hover: #2bbf8a;
            --danger: #f87171;
            --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-full: 9999px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --mic-pulse-color: rgba(79, 140, 255, 0.5);
            --glass-bg: rgba(26, 35, 50, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        :root[data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-card: #ffffffcc;
            --bg-card-solid: #ffffff;
            --bg-input: #f8fafc;
            --bg-chip: #e2e8f0;
            --bg-chip-hover: #cbd5e1;
            --bg-surface: #f1f5f9;
            --border: #e2e8f0;
            --border-light: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-glow: rgba(37, 99, 235, 0.15);
            --accent: #059669;
            --accent-hover: #047857;
            --danger: #dc2626;
            --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-full: 9999px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --mic-pulse-color: rgba(37, 99, 235, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.06);
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            transition: background-color var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== Glass Card ===== */
        .app-card {
            width: 100%;
            max-width: 680px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0.6;
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand .logo {
            font-size: 1.6rem;
            line-height: 1;
        }

        .brand h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, var(--text-main) 60%, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .icon-btn {
            background: var(--bg-chip);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background var(--transition), transform var(--transition), border-color var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            line-height: 1;
        }

        .icon-btn:hover {
            background: var(--bg-chip-hover);
            border-color: var(--border-light);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .icon-btn .label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }

        /* ===== Language Controls ===== */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 18px;
        }

        .controls-grid select {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color var(--transition), box-shadow var(--transition);
            width: 100%;
            appearance: auto;
            -webkit-appearance: auto;
        }

        .controls-grid select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .swap-btn {
            background: var(--bg-chip);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            transition: background var(--transition), transform var(--transition), border-color var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .swap-btn:hover {
            background: var(--bg-chip-hover);
            border-color: var(--border-light);
        }

        .swap-btn:active {
            transform: rotate(180deg) scale(0.92);
        }

        /* ===== IO ===== */
        .io-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-group label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .field-group label .badge {
            font-size: 0.55rem;
            background: var(--primary);
            color: #fff;
            padding: 1px 8px;
            border-radius: var(--radius-full);
            font-weight: 600;
            text-transform: none;
            letter-spacing: 0;
        }

        textarea,
        .output-box {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color var(--transition), box-shadow var(--transition);
            width: 100%;
            line-height: 1.6;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            max-height: 180px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        textarea::placeholder {
            color: var(--text-dim);
            opacity: 0.7;
        }

        .output-box {
            min-height: 80px;
            white-space: pre-wrap;
            word-break: break-word;
            background: var(--bg-input);
            display: flex;
            align-items: flex-start;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 9px 16px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-family: inherit;
            transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
            flex: 1 1 auto;
            min-width: 70px;
            line-height: 1.4;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .btn-secondary {
            background: var(--bg-chip);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--bg-chip-hover);
        }

        .btn-success {
            background: var(--accent);
            color: #fff;
        }
        .btn-success:hover {
            background: var(--accent-hover);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            opacity: 0.85;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.75rem;
            min-width: 40px;
            flex: 0 1 auto;
        }

        .btn-clear {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 6px 10px;
            font-size: 0.75rem;
        }
        .btn-clear:hover {
            background: var(--bg-chip);
        }

        /* ===== Mic ===== */
        .mic-btn-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--bg-chip);
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid var(--border);
            z-index: 2;
        }

        .mic-btn:hover {
            background: var(--bg-chip-hover);
            border-color: var(--border-light);
        }
        .mic-btn:active {
            transform: scale(0.92);
        }
        .mic-btn .mic-icon {
            transition: transform 0.2s ease;
            line-height: 1;
        }
        .mic-pulse-ring {
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid var(--mic-pulse-color);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 1;
        }
        .mic-btn.listening .mic-pulse-ring {
            opacity: 1;
            animation: micPulse 1.4s ease-in-out infinite;
        }
        .mic-btn.listening {
            background: color-mix(in srgb, var(--primary) 20%, var(--bg-chip));
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .mic-btn.listening .mic-icon {
            transform: scale(1.1);
        }
        .mic-btn.error-state {
            border-color: var(--danger);
            box-shadow: 0 0 20px rgba(248, 113, 113, 0.25);
            animation: micShake 0.4s ease;
        }

        @keyframes micPulse {
            0% {
                transform: scale(1);
                opacity: 0.7;
            }
            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }
        @keyframes micShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            75% {
                transform: translateX(6px);
            }
        }

        .mic-status-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-left: 8px;
            transition: color var(--transition);
            white-space: nowrap;
            min-width: 70px;
        }
        .mic-status-label.active {
            color: var(--primary);
        }
        .mic-status-label.error {
            color: var(--danger);
        }
        .mic-status-label.success {
            color: var(--accent);
        }

        .auto-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }
        .auto-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
            margin: 0;
        }

        /* ===== Library ===== */
        .library-section {
            margin-top: 8px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .library-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .library-header label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .library-header .count-badge {
            font-size: 0.6rem;
            background: var(--bg-chip);
            padding: 1px 10px;
            border-radius: var(--radius-full);
            color: var(--text-muted);
            font-weight: 600;
        }

        .chips-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 170px;
            overflow-y: auto;
            padding: 2px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .chips-grid::-webkit-scrollbar {
            width: 4px;
        }
        .chips-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .chips-grid::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .chip {
            background: var(--bg-chip);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 7px 16px;
            border-radius: var(--radius-full);
            font-size: 0.82rem;
            cursor: pointer;
            transition: background var(--transition), transform var(--transition), border-color var(--transition);
            font-family: inherit;
            white-space: nowrap;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chip:hover {
            background: var(--bg-chip-hover);
            border-color: var(--border-light);
            transform: translateY(-1px);
        }
        .chip:active {
            transform: scale(0.96);
        }
        .chip .append-icon {
            font-size: 0.6rem;
            margin-left: 4px;
            opacity: 0.6;
        }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 3000;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal {
            background: var(--bg-card-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-header .close-btn {
            background: var(--bg-chip);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition), transform var(--transition);
        }
        .modal-header .close-btn:hover {
            background: var(--bg-chip-hover);
        }
        .modal-header .close-btn:active {
            transform: scale(0.92);
        }

        .modal-body {
            overflow-y: auto;
            padding: 16px 0 4px;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-body::-webkit-scrollbar {
            width: 4px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .setting-section {
            padding-bottom: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }
        .setting-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .setting-section .section-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            display: block;
            margin-bottom: 10px;
        }

        .add-card-row {
            display: flex;
            gap: 8px;
        }
        .add-card-row input {
            flex: 1;
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color var(--transition), box-shadow var(--transition);
            min-width: 0;
        }
        .add-card-row input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .add-card-row input::placeholder {
            color: var(--text-dim);
            opacity: 0.7;
        }
        .add-card-row .btn {
            flex: 0 0 auto;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card-item {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            transition: border-color var(--transition);
        }
        .card-item:hover {
            border-color: var(--border-light);
        }
        .card-item .edit-card-input {
            flex: 1;
            background: transparent;
            color: var(--text-main);
            border: none;
            padding: 4px 0;
            font-size: 0.9rem;
            font-family: inherit;
            min-width: 80px;
            outline: none;
            border-bottom: 1px dashed transparent;
            transition: border-color var(--transition);
        }
        .card-item .edit-card-input:focus {
            border-bottom-color: var(--primary);
        }
        .card-item .card-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .card-item .card-actions .btn {
            padding: 4px 12px;
            font-size: 0.7rem;
            border-radius: var(--radius-full);
            flex: 0 0 auto;
            min-width: 0;
            font-weight: 600;
        }
        .card-item .card-actions .btn-save {
            background: var(--primary);
            color: #fff;
        }
        .card-item .card-actions .btn-save:hover {
            background: var(--primary-hover);
        }
        .card-item .card-actions .btn-delete {
            background: var(--danger);
            color: #fff;
        }
        .card-item .card-actions .btn-delete:hover {
            opacity: 0.85;
        }

        .empty-cards-msg {
            color: var(--text-dim);
            font-size: 0.85rem;
            text-align: center;
            padding: 20px 0;
        }

        /* ===== History ===== */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .history-item {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            cursor: pointer;
            transition: background var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .history-item:hover {
            background: var(--bg-chip);
        }
        .history-item .history-text {
            font-size: 0.85rem;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-item .history-time {
            font-size: 0.65rem;
            color: var(--text-dim);
            flex-shrink: 0;
        }
        .history-empty {
            color: var(--text-dim);
            font-size: 0.85rem;
            text-align: center;
            padding: 12px 0;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 20px;
            box-shadow: var(--shadow);
            z-index: 5000;
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            font-size: 0.85rem;
            color: var(--text-main);
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .app-card {
                padding: 16px;
                border-radius: var(--radius-sm);
            }
            .brand h1 {
                font-size: 1rem;
            }
            .brand .logo {
                font-size: 1.3rem;
            }
            .controls-grid {
                gap: 6px;
            }
            .controls-grid select {
                font-size: 0.8rem;
                padding: 8px 10px;
            }
            .swap-btn {
                width: 34px;
                height: 34px;
                font-size: 0.9rem;
            }
            .btn {
                font-size: 0.78rem;
                padding: 7px 12px;
                min-width: 60px;
            }
            .icon-btn .label {
                display: none;
            }
            .modal {
                padding: 16px 18px 18px;
                max-height: 95vh;
            }
            .card-item {
                padding: 8px 10px;
                gap: 6px;
            }
            .card-item .edit-card-input {
                font-size: 0.82rem;
                min-width: 60px;
            }
            .card-item .card-actions .btn {
                font-size: 0.65rem;
                padding: 3px 10px;
            }
            .mic-btn {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
            .mic-status-label {
                font-size: 0.6rem;
                min-width: 50px;
            }
        }

        @media (max-width: 400px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .header-actions {
                justify-content: flex-end;
            }
            .controls-grid {
                grid-template-columns: 1fr auto 1fr;
            }
            .add-card-row {
                flex-wrap: wrap;
            }
            .add-card-row input {
                width: 100%;
                flex: 1 1 100%;
            }
            .add-card-row .btn {
                flex: 1 1 auto;
            }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .app-card,
        .modal,
        .chips-grid,
        .history-list {
            scroll-behavior: smooth;
        }

        .translating .output-box {
            opacity: 0.6;
        }

        .interim-text {
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>

<body>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Main App -->
    <main class="app-card" id="appCard">

        <header class="header">
            <div class="brand">
                <span class="logo">🛎️</span>
                <h1>Service Translator</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="historyBtn" aria-label="History">🕒 <span class="label">History</span></button>
                <button class="icon-btn" id="openSettingsBtn" aria-label="Settings">⚙️ <span class="label">Settings</span></button>
                <button class="icon-btn" id="themeToggleBtn" aria-label="Toggle theme">🌙 <span class="label">Theme</span></button>
            </div>
        </header>

        <div class="controls-grid">
            <select id="sourceLang" aria-label="Source language">
                <option value="en">English</option>
                <option value="zh">Chinese</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
            </select>
            <button class="swap-btn" id="swapBtn" aria-label="Swap languages">⇄</button>
            <select id="targetLang" aria-label="Target language">
                <option value="en">English</option>
                <option value="zh" selected>Chinese</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
            </select>
        </div>

        <div class="io-section">
            <div class="field-group">
                <label>Original Message <span class="badge">tap cards to build</span></label>
                <textarea id="inputText" placeholder="Type, speak, or tap cards to build your sentence…" rows="2"></textarea>
                <div class="btn-row">
                    <button class="btn btn-primary" id="translateBtn">⚡ Translate</button>
                    <div class="mic-btn-wrapper">
                        <button class="mic-btn" id="micBtn" aria-label="Voice input">
                            <span class="mic-icon">🎤</span>
                            <span class="mic-pulse-ring"></span>
                        </button>
                        <span class="mic-status-label" id="micStatusLabel">Ready</span>
                    </div>
                    <button class="btn btn-secondary btn-small btn-clear" id="clearBtn">✕ Clear</button>
                    <label class="auto-toggle" title="Translate automatically as you type">
                        <input type="checkbox" id="autoTranslateCheck" /> Auto
                    </label>
                </div>
            </div>

            <div class="field-group">
                <label>Translation Result <span class="badge">copy &amp; read</span></label>
                <div class="output-box" id="outputText" aria-live="polite">Translation will appear here…</div>
                <div class="btn-row">
                    <button class="btn btn-primary" id="speakBtn">🔊 Read Aloud</button>
                    <button class="btn btn-secondary" id="copyBtn">📋 Copy</button>
                    <button class="btn btn-secondary btn-small btn-clear" id="clearOutputBtn">✕ Clear</button>
                </div>
            </div>
        </div>

        <div class="library-section">
            <div class="library-header">
                <label>📋 Suggestion Cards <span style="font-weight:400; text-transform:none; font-size:0.7rem; color:var(--text-dim);">(tap to append)</span>
                    <span class="count-badge" id="phraseCount">0</span>
                </label>
                <button class="icon-btn" id="openSettingsBtnFromLibrary" aria-label="Manage cards" style="font-size:0.75rem; padding:4px 10px;">✏️ <span class="label">Manage</span></button>
            </div>
            <div class="chips-grid" id="phraseContainer" role="list"></div>
        </div>

    </main>

    <!-- History Modal -->
    <div class="modal-overlay" id="historyModal" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
        <div class="modal">
            <div class="modal-header">
                <h3 id="historyTitle">🕒 Translation History</h3>
                <button class="close-btn" id="closeHistoryBtn">✖</button>
            </div>
            <div class="modal-body">
                <div class="history-list" id="historyList">
                    <!-- dynamically rendered -->
                </div>
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <button class="btn btn-secondary btn-small" id="clearHistoryBtn" style="flex:1;">🗑️ Clear All</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">⚙️ Settings &amp; Cards</h3>
                <button class="close-btn" id="closeModalBtn">✖</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="setting-section">
                    <span class="section-label">➕ Add Custom Card</span>
                    <div class="add-card-row">
                        <input type="text" id="newCardInput" placeholder="Type a new phrase…" maxlength="120" />
                        <button class="btn btn-primary" id="addCardBtn">Add</button>
                    </div>
                </div>

                <div class="setting-section">
                    <span class="section-label">📋 Manage Saved Cards</span>
                    <div class="card-list" id="modalCardList"></div>
                    <div style="margin-top:8px;">
                        <button class="btn btn-secondary btn-small" id="resetCardsBtn">↺ Reset to Default</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM REFS ─────────────────────────────────────────────
            const $ = (sel, ctx) => (ctx || document).querySelector(sel);
            const $$ = (sel, ctx) => Array.from((ctx || document).querySelectorAll(sel));

            const htmlEl = document.documentElement;
            const themeToggleBtn = $('#themeToggleBtn');
            const sourceLang = $('#sourceLang');
            const targetLang = $('#targetLang');
            const swapBtn = $('#swapBtn');
            const inputText = $('#inputText');
            const outputText = $('#outputText');
            const translateBtn = $('#translateBtn');
            const speakBtn = $('#speakBtn');
            const copyBtn = $('#copyBtn');
            const micBtn = $('#micBtn');
            const micStatusLabel = $('#micStatusLabel');
            const clearBtn = $('#clearBtn');
            const clearOutputBtn = $('#clearOutputBtn');
            const autoTranslateCheck = $('#autoTranslateCheck');
            const phraseContainer = $('#phraseContainer');
            const phraseCount = $('#phraseCount');

            const modalOverlay = $('#modalOverlay');
            const openSettingsBtn = $('#openSettingsBtn');
            const openSettingsBtnFromLibrary = $('#openSettingsBtnFromLibrary');
            const closeModalBtn = $('#closeModalBtn');
            const modalCardList = $('#modalCardList');
            const newCardInput = $('#newCardInput');
            const addCardBtn = $('#addCardBtn');
            const resetCardsBtn = $('#resetCardsBtn');

            const historyModal = $('#historyModal');
            const historyBtn = $('#historyBtn');
            const closeHistoryBtn = $('#closeHistoryBtn');
            const historyList = $('#historyList');
            const clearHistoryBtn = $('#clearHistoryBtn');

            const toast = $('#toast');
            let toastTimeout = null;

            // ─── DEFAULTS ─────────────────────────────────────────────
            const DEFAULT_PHRASES = [
                'Do you need room cleaning',
                'Shall I come back later',
                'When do you want cleaning',
                'Would you like fresh towels',
                'Do you have laundry',
                'Is everything okay',
                'Can I help you with anything',
                'What time is check-out'
            ];

            const STORAGE_KEY = 'pwa_translator_cards';
            const THEME_STORAGE_KEY = 'pwa_translator_theme';
            const AUTO_TRANSLATE_KEY = 'pwa_auto_translate';
            const HISTORY_KEY = 'pwa_translator_history';

            // ─── TOAST ──────────────────────────────────────────────────
            function showToast(msg, duration = 2000) {
                if (toastTimeout) clearTimeout(toastTimeout);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                    toastTimeout = null;
                }, duration);
            }

            // ─── HISTORY ──────────────────────────────────────────────
            function getHistory() {
                try {
                    const raw = localStorage.getItem(HISTORY_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) return parsed;
                    }
                } catch (_) { /* ignore */ }
                return [];
            }

            function saveHistory(history) {
                try {
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                } catch (_) { /* ignore */ }
            }

            function addToHistory(sourceText, translatedText, srcLang, tgtLang) {
                if (!sourceText || !translatedText) return;
                const history = getHistory();
                const entry = {
                    source: sourceText.trim(),
                    translation: translatedText.trim(),
                    srcLang,
                    tgtLang,
                    timestamp: Date.now()
                };
                // Avoid duplicate consecutive
                if (history.length > 0) {
                    const last = history[0];
                    if (last.source === entry.source && last.translation === entry.translation) {
                        return;
                    }
                }
                history.unshift(entry);
                // Limit to 100 entries
                if (history.length > 100) history.length = 100;
                saveHistory(history);
            }

            function renderHistory() {
                const history = getHistory();
                historyList.innerHTML = '';
                if (!history.length) {
                    const empty = document.createElement('div');
                    empty.className = 'history-empty';
                    empty.textContent = 'No translations yet.';
                    historyList.appendChild(empty);
                    return;
                }
                history.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    const textSpan = document.createElement('span');
                    textSpan.className = 'history-text';
                    textSpan.textContent = `${item.source} → ${item.translation}`;
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'history-time';
                    const date = new Date(item.timestamp);
                    timeSpan.textContent = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    div.appendChild(textSpan);
                    div.appendChild(timeSpan);
                    div.addEventListener('click', () => {
                        // Load this translation into input and output
                        inputText.value = item.source;
                        outputText.textContent = item.translation;
                        // Set languages
                        sourceLang.value = item.srcLang || 'en';
                        targetLang.value = item.tgtLang || 'zh';
                        closeHistoryModal();
                        showToast('Loaded from history');
                    });
                    historyList.appendChild(div);
                });
            }

            function clearHistory() {
                saveHistory([]);
                renderHistory();
                showToast('History cleared');
            }

            function openHistoryModal() {
                renderHistory();
                historyModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeHistoryModal() {
                historyModal.classList.remove('active');
                document.body.style.overflow = '';
            }

            historyBtn.addEventListener('click', openHistoryModal);
            closeHistoryBtn.addEventListener('click', closeHistoryModal);
            historyModal.addEventListener('click', (e) => {
                if (e.target === historyModal) closeHistoryModal();
            });
            clearHistoryBtn.addEventListener('click', clearHistory);

            // ─── THEME ─────────────────────────────────────────────────
            function loadTheme() {
                try {
                    const saved = localStorage.getItem(THEME_STORAGE_KEY);
                    if (saved === 'light' || saved === 'dark') {
                        htmlEl.setAttribute('data-theme', saved);
                        themeToggleBtn.innerText = saved === 'dark' ? '🌙' : '☀️';
                        return;
                    }
                } catch (_) { /* ignore */ }
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = prefersDark ? 'dark' : 'light';
                htmlEl.setAttribute('data-theme', theme);
                themeToggleBtn.innerText = theme === 'dark' ? '🌙' : '☀️';
            }

            function toggleTheme() {
                const isDark = htmlEl.getAttribute('data-theme') === 'dark';
                const next = isDark ? 'light' : 'dark';
                htmlEl.setAttribute('data-theme', next);
                themeToggleBtn.innerText = next === 'dark' ? '🌙' : '☀️';
                try {
                    localStorage.setItem(THEME_STORAGE_KEY, next);
                } catch (_) { /* ignore */ }
            }

            themeToggleBtn.addEventListener('click', toggleTheme);

            // ─── CARDS ──────────────────────────────────────────────────
            function getCards() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed) && parsed.length) return parsed;
                    }
                } catch (_) { /* ignore */ }
                return [...DEFAULT_PHRASES];
            }

            function saveCards(cards) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
                } catch (_) { /* ignore */ }
                renderAll();
            }

            function resetCards() {
                if (confirm('Reset all cards to default?')) {
                    saveCards([...DEFAULT_PHRASES]);
                    showToast('Cards reset to default');
                }
            }
            resetCardsBtn.addEventListener('click', resetCards);

            function renderMainCards() {
                const cards = getCards();
                phraseContainer.innerHTML = '';
                cards.forEach(text => {
                    const btn = document.createElement('button');
                    btn.className = 'chip';
                    btn.innerHTML = `${text} <span class="append-icon">+</span>`;
                    btn.setAttribute('role', 'listitem');
                    btn.title = 'Tap to append to your message';
                    btn.addEventListener('click', () => {
                        appendToInput(text);
                    });
                    phraseContainer.appendChild(btn);
                });
                phraseCount.textContent = cards.length;
            }

            function renderModalCards() {
                const cards = getCards();
                modalCardList.innerHTML = '';
                if (!cards.length) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-cards-msg';
                    empty.textContent = 'No cards yet. Add one above!';
                    modalCardList.appendChild(empty);
                    return;
                }
                cards.forEach((text, index) => {
                    const item = document.createElement('div');
                    item.className = 'card-item';
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'edit-card-input';
                    input.value = text;
                    input.dataset.index = index;
                    input.maxLength = 120;
                    const actions = document.createElement('div');
                    actions.className = 'card-actions';
                    const saveBtn = document.createElement('button');
                    saveBtn.className = 'btn btn-save';
                    saveBtn.textContent = '💾 Save';
                    saveBtn.dataset.index = index;
                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn btn-delete';
                    delBtn.textContent = '🗑️';
                    delBtn.dataset.index = index;
                    delBtn.setAttribute('aria-label', 'Delete card');
                    actions.appendChild(saveBtn);
                    actions.appendChild(delBtn);
                    item.appendChild(input);
                    item.appendChild(actions);
                    modalCardList.appendChild(item);

                    saveBtn.addEventListener('click', () => {
                        const newVal = input.value.trim();
                        if (!newVal) return;
                        const updated = getCards();
                        updated[index] = newVal;
                        saveCards(updated);
                        showToast('Card updated');
                    });
                    delBtn.addEventListener('click', () => {
                        const updated = getCards();
                        updated.splice(index, 1);
                        saveCards(updated);
                        showToast('Card deleted');
                    });
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            saveBtn.click();
                        }
                    });
                });
            }

            function renderAll() {
                renderMainCards();
                renderModalCards();
            }

            // ─── APPEND ─────────────────────────────────────────────────
            function appendToInput(text) {
                const current = inputText.value;
                const trimmedCurrent = current.trim();
                const trimmedText = text.trim();
                if (!trimmedText) return;
                if (trimmedCurrent === '') {
                    inputText.value = trimmedText;
                } else {
                    const endsWithSpace = current.endsWith(' ') || current.endsWith('\n');
                    inputText.value = current + (endsWithSpace ? '' : ' ') + trimmedText;
                }
                if (autoTranslateCheck.checked) {
                    debouncedTranslate();
                }
                inputText.focus();
            }

            // ─── CLEAR ──────────────────────────────────────────────────
            clearBtn.addEventListener('click', () => {
                inputText.value = '';
                if (autoTranslateCheck.checked) {
                    debouncedTranslate.cancel && debouncedTranslate.cancel();
                }
                inputText.focus();
            });

            clearOutputBtn.addEventListener('click', () => {
                outputText.textContent = 'Translation will appear here…';
            });

            // ─── ADD CARD ─────────────────────────────────────────────
            addCardBtn.addEventListener('click', () => {
                const val = newCardInput.value.trim();
                if (!val) return;
                const cards = getCards();
                cards.push(val);
                saveCards(cards);
                newCardInput.value = '';
                newCardInput.focus();
                showToast('Card added');
            });
            newCardInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addCardBtn.click();
                }
            });

            // ─── TRANSLATE ─────────────────────────────────────────────
            let translateTimeout = null;

            async function translateText() {
                const text = inputText.value.trim();
                if (!text) {
                    outputText.textContent = 'Please enter some text to translate.';
                    return;
                }
                const src = sourceLang.value;
                const tgt = targetLang.value;
                if (src === tgt) {
                    outputText.textContent = text;
                    addToHistory(text, text, src, tgt);
                    return;
                }
                outputText.textContent = 'Translating…';
                translateBtn.disabled = true;
                const pair = `${src}|${tgt}`;
                const url =
                    `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${pair}`;
                try {
                    const resp = await fetch(url, { signal: AbortSignal.timeout(8000) });
                    const data = await resp.json();
                    if (data.responseData && data.responseData.translatedText) {
                        const translation = data.responseData.translatedText;
                        outputText.textContent = translation;
                        addToHistory(text, translation, src, tgt);
                    } else {
                        outputText.textContent = '⚠️ Translation unavailable. Please try again.';
                    }
                } catch (err) {
                    outputText.textContent =
                        '🌐 Offline: Full translation needs network. Saved phrases and speech still work!';
                } finally {
                    translateBtn.disabled = false;
                }
            }

            function debouncedTranslate() {
                if (translateTimeout) clearTimeout(translateTimeout);
                translateTimeout = setTimeout(() => {
                    translateText();
                    translateTimeout = null;
                }, 550);
            }

            translateBtn.addEventListener('click', translateText);

            // Auto-translate
            autoTranslateCheck.addEventListener('change', () => {
                try {
                    localStorage.setItem(AUTO_TRANSLATE_KEY, autoTranslateCheck.checked ? 'true' : 'false');
                } catch (_) { /* ignore */ }
                if (autoTranslateCheck.checked && inputText.value.trim()) {
                    debouncedTranslate();
                }
            });

            try {
                const autoPref = localStorage.getItem(AUTO_TRANSLATE_KEY);
                if (autoPref === 'true') {
                    autoTranslateCheck.checked = true;
                }
            } catch (_) { /* ignore */ }

            inputText.addEventListener('input', () => {
                if (autoTranslateCheck.checked) {
                    debouncedTranslate();
                }
            });

            inputText.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    translateText();
                }
            });

            // ─── SWAP ───────────────────────────────────────────────────
            swapBtn.addEventListener('click', () => {
                const temp = sourceLang.value;
                sourceLang.value = targetLang.value;
                targetLang.value = temp;
                if (autoTranslateCheck.checked && inputText.value.trim()) {
                    debouncedTranslate();
                }
            });

            // ─── SPEAK ──────────────────────────────────────────────────
            async function speakText(text, langCode) {
                return new Promise((resolve) => {
                    if (!text || text.startsWith('Translation will') || text.includes('Offline') || text
                        .includes('⚠️')) {
                        resolve(false);
                        return;
                    }
                    window.speechSynthesis.cancel();
                    const langMap = { en: 'en-US', zh: 'zh-CN', ja: 'ja-JP', ko: 'ko-KR' };
                    const lang = langMap[langCode] || 'en-US';
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = lang;
                    utterance.rate = 0.92;
                    utterance.pitch = 1.0;
                    const voices = window.speechSynthesis.getVoices();
                    const nativeVoice = voices.find(v => v.lang.startsWith(lang.split('-')[0]) && v.localService);
                    if (nativeVoice) utterance.voice = nativeVoice;
                    utterance.onend = () => { resolve(true); };
                    utterance.onerror = () => { resolve(false); };
                    window.speechSynthesis.speak(utterance);
                });
            }

            speakBtn.addEventListener('click', async () => {
                const text = outputText.textContent;
                if (!text || text.startsWith('Translation will') || text.includes('Offline') || text.includes(
                    '⚠️')) {
                    showToast('Nothing to read');
                    return;
                }
                const orig = speakBtn.textContent;
                speakBtn.textContent = '🔊 Speaking…';
                speakBtn.disabled = true;
                await speakText(text, targetLang.value);
                speakBtn.textContent = orig;
                speakBtn.disabled = false;
            });

            if (window.speechSynthesis) {
                window.speechSynthesis.getVoices();
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.getVoices();
                };
            }

            // ─── COPY ───────────────────────────────────────────────────
            copyBtn.addEventListener('click', async () => {
                const text = outputText.textContent;
                if (!text || text.startsWith('Translation will')) return;
                try {
                    await navigator.clipboard.writeText(text);
                    showToast('Copied!');
                } catch (_) {
                    const range = document.createRange();
                    range.selectNode(outputText);
                    window.getSelection().removeAllRanges();
                    window.getSelection().addRange(range);
                    document.execCommand('copy');
                    window.getSelection().removeAllRanges();
                    showToast('Copied!');
                }
            });

            // ─── SPEECH RECOGNITION ──────────────────────────────────
            let recognition = null;
            let isListening = false;
            let shouldRestart = false;
            let finalTranscript = '';
            let interimTranscript = '';
            let restartTimeout = null;
            let silenceTimer = null;
            const SILENCE_TIMEOUT = 2000;

            const langMap = { en: 'en-US', zh: 'zh-CN', ja: 'ja-JP', ko: 'ko-KR' };

            function getRecognitionLang() {
                return langMap[sourceLang.value] || 'en-US';
            }

            function updateMicStatus(status, isError = false, isSuccess = false) {
                micStatusLabel.textContent = status;
                micStatusLabel.className = 'mic-status-label';
                if (isError) micStatusLabel.classList.add('error');
                else if (isSuccess) micStatusLabel.classList.add('success');
                else if (isListening) micStatusLabel.classList.add('active');
            }

            function setMicState(state) {
                micBtn.classList.remove('listening', 'error-state');
                if (state === 'listening') {
                    micBtn.classList.add('listening');
                    micBtn.querySelector('.mic-icon').textContent = '🎤';
                    updateMicStatus('Listening…');
                } else if (state === 'processing') {
                    micBtn.classList.remove('listening');
                    micBtn.querySelector('.mic-icon').textContent = '⏳';
                    updateMicStatus('Processing…');
                } else if (state === 'error') {
                    micBtn.classList.add('error-state');
                    micBtn.querySelector('.mic-icon').textContent = '⚠️';
                    updateMicStatus('Error', true);
                    setTimeout(() => {
                        micBtn.classList.remove('error-state');
                        if (!isListening) {
                            micBtn.querySelector('.mic-icon').textContent = '🎤';
                            updateMicStatus('Ready');
                        }
                    }, 1500);
                } else {
                    micBtn.classList.remove('listening');
                    micBtn.querySelector('.mic-icon').textContent = '🎤';
                    updateMicStatus('Ready');
                }
            }

            function initRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    micBtn.style.opacity = '0.4';
                    micBtn.title = 'Speech recognition not supported';
                    updateMicStatus('Unsupported', true);
                    return null;
                }
                const rec = new SpeechRecognition();
                rec.continuous = true;
                rec.interimResults = true;
                rec.maxAlternatives = 1;
                rec.lang = getRecognitionLang();

                rec.onstart = function() {
                    isListening = true;
                    finalTranscript = '';
                    interimTranscript = '';
                    setMicState('listening');
                };

                rec.onend = function() {
                    isListening = false;
                    if (finalTranscript.trim()) {
                        inputText.value = finalTranscript.trim();
                        if (autoTranslateCheck.checked) {
                            debouncedTranslate();
                        } else {
                            translateText();
                        }
                        finalTranscript = '';
                        setMicState('idle');
                        updateMicStatus('Done ✓', false, true);
                        setTimeout(() => {
                            if (!isListening) updateMicStatus('Ready');
                        }, 1200);
                    } else if (interimTranscript.trim()) {
                        inputText.value = interimTranscript.trim();
                        if (autoTranslateCheck.checked) {
                            debouncedTranslate();
                        } else {
                            translateText();
                        }
                        interimTranscript = '';
                        setMicState('idle');
                        updateMicStatus('Done ✓', false, true);
                        setTimeout(() => {
                            if (!isListening) updateMicStatus('Ready');
                        }, 1200);
                    } else {
                        setMicState('idle');
                        if (!finalTranscript && !interimTranscript) updateMicStatus('Ready');
                    }
                    if (shouldRestart) {
                        shouldRestart = false;
                        if (restartTimeout) clearTimeout(restartTimeout);
                        restartTimeout = setTimeout(() => {
                            if (!isListening && !document.hidden) {
                                startListening();
                            }
                            restartTimeout = null;
                        }, 300);
                    }
                };

                rec.onerror = function(event) {
                    console.warn('Speech error:', event.error);
                    if (event.error === 'not-allowed' || event.error === 'audio-capture') {
                        setMicState('error');
                        updateMicStatus('Mic unavailable', true);
                        isListening = false;
                        shouldRestart = false;
                        return;
                    }
                    if (event.error === 'no-speech') return;
                    if (isListening) {
                        setMicState('error');
                        setTimeout(() => {
                            if (!isListening && !document.hidden) startListening();
                        }, 500);
                    }
                };

                rec.onresult = function(event) {
                    let interim = '',
                        final = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const result = event.results[i];
                        const transcript = result[0].transcript;
                        if (result.isFinal) {
                            final += transcript;
                        } else {
                            interim += transcript;
                        }
                    }
                    if (final) {
                        finalTranscript = final;
                        inputText.value = final.trim();
                        if (autoTranslateCheck.checked) debouncedTranslate();
                        resetSilenceTimer();
                    }
                    if (interim) {
                        interimTranscript = interim;
                        const currentFinal = finalTranscript.trim();
                        const displayText = currentFinal ? currentFinal + ' ' + interim : interim;
                        inputText.value = displayText.trim();
                        resetSilenceTimer();
                    }
                };
                return rec;
            }

            function resetSilenceTimer() {
                if (silenceTimer) clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    if (finalTranscript.trim() && isListening) {
                        try {
                            if (recognition) {
                                recognition.stop();
                                shouldRestart = true;
                            }
                        } catch (_) { /* ignore */ }
                    }
                    silenceTimer = null;
                }, SILENCE_TIMEOUT);
            }

            function startListening() {
                if (isListening) return;
                if (!recognition) {
                    recognition = initRecognition();
                    if (!recognition) return;
                }
                const currentLang = getRecognitionLang();
                if (recognition.lang !== currentLang) recognition.lang = currentLang;
                finalTranscript = '';
                interimTranscript = '';
                shouldRestart = true;
                try {
                    recognition.start();
                    isListening = true;
                    setMicState('listening');
                    updateMicStatus('Listening…');
                } catch (e) {
                    if (e.name === 'InvalidStateError') {
                        try {
                            recognition.stop();
                            setTimeout(() => startListening(), 300);
                        } catch (_) { /* ignore */ }
                    } else {
                        setMicState('error');
                        updateMicStatus('Error starting', true);
                        isListening = false;
                    }
                }
            }

            function stopListening() {
                shouldRestart = false;
                if (silenceTimer) {
                    clearTimeout(silenceTimer);
                    silenceTimer = null;
                }
                if (recognition && isListening) {
                    try {
                        recognition.stop();
                    } catch (_) { /* ignore */ }
                }
                isListening = false;
                setMicState('idle');
                updateMicStatus('Ready');
            }

            function toggleListening() {
                if (isListening) {
                    stopListening();
                    if (inputText.value.trim()) {
                        if (autoTranslateCheck.checked) debouncedTranslate();
                        else translateText();
                    }
                } else {
                    startListening();
                }
            }

            micBtn.addEventListener('click', toggleListening);

            document.addEventListener('visibilitychange', () => {
                if (document.hidden && isListening) {
                    // Keep listening, but don't auto-restart when hidden
                }
            });

            // ─── MODAL ──────────────────────────────────────────────────
            function openModal() {
                renderModalCards();
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            openSettingsBtn.addEventListener('click', openModal);
            openSettingsBtnFromLibrary.addEventListener('click', openModal);
            closeModalBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (modalOverlay.classList.contains('active')) closeModal();
                    if (historyModal.classList.contains('active')) closeHistoryModal();
                }
            });

            // ─── INIT ──────────────────────────────────────────────────
            loadTheme();
            renderAll();
            recognition = initRecognition();

            if (inputText.value.trim() && autoTranslateCheck.checked) {
                setTimeout(debouncedTranslate, 500);
            }

            sourceLang.addEventListener('change', () => {
                if (recognition && isListening) {
                    stopListening();
                    recognition.lang = getRecognitionLang();
                }
                if (autoTranslateCheck.checked && inputText.value.trim()) debouncedTranslate();
            });
            targetLang.addEventListener('change', () => {
                if (autoTranslateCheck.checked && inputText.value.trim()) debouncedTranslate();
            });

            console.log('🛎️ Service Translator PWA improved with history and polished UI');
        })();
    </script>

</body>
</html>
